name: pipeline
on:
  push:
    branches:
      - main
      - dev
jobs: 
  simple-pipeline:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v4
        - name: Install Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
        - name: Install dependecies
          run: npm install
        - name: Check Style
          run: npm run eslint
        - name : Run Tests
          run: npm run test